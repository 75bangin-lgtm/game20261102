const DATA=raw.split('\n').map(r=>{const [word,hanja,meaning]=r.split('|');return{word,hanja,meaning}});
const $=id=>document.getElementById(id);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let best=0,storageOK=true;try{best=Number(localStorage.getItem('idiomDetective.best.v1'))||0}catch(e){storageOK=false}const showBest=()=>{$('best').textContent=`최고 ${best}점`};showBest();$('count').textContent=DATA.length;if(!storageOK)$('storage').textContent='이 브라우저에서는 최고 점수가 저장되지 않습니다.';
let deck=[],index=0,score=0,correct=0,wrong=[],history=[],mode='choice',practice=false,active=false,usedHint=false,deadline=0,timer=null,current=null,answer='',front=true;
function screen(id){['home','play','result'].forEach(s=>$(s).classList.toggle('hidden',s!==id));window.scrollTo(0,0)}
function start(items=null){clearInterval(timer);practice=Array.isArray(items);deck=shuffle(items||DATA).slice(0,practice?items.length:10);index=0;score=0;correct=0;wrong=[];history=[];mode=$('mode').value;screen('play');question()}
function question(){current=deck[index];front=Math.random()<.5;answer=front?current.word.slice(2):current.word.slice(0,2);active=true;usedHint=false;$('progress').textContent=`${practice?'복습 ':''}${index+1} / ${deck.length}`;$('points').textContent=`${score}점`;$('direction').textContent=front?'뒤의 두 글자를 맞혀 보세요':'앞의 두 글자를 맞혀 보세요';$('puzzle').innerHTML='';[...current.word].forEach((c,i)=>{let t=document.createElement('span');let blank=front?i>=2:i<2;t.className='tile'+(blank?' blank':'');t.textContent=blank?'?':c;$('puzzle').append(t)});['feedback','next','hintText'].forEach(id=>$(id).classList.add('hidden'));$('hint').disabled=false;$('typed').disabled=false;$('typed').value='';$('submit').disabled=false;$('choices').innerHTML='';$('choices').classList.toggle('hidden',mode!=='choice');$('form').classList.toggle('hidden',mode!=='input');
// Exclude distractors that would form another valid idiom in this question.
const known=new Set(DATA.map(d=>d.word));const pool=[...new Set(DATA.map(d=>front?d.word.slice(2):d.word.slice(0,2)))].filter(s=>s!==answer&&!known.has(front?current.word.slice(0,2)+s:s+current.word.slice(2)));
shuffle([answer,...shuffle(pool).slice(0,3)]).forEach(s=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>finish(s);$('choices').append(b)});deadline=Date.now()+15000;tick();timer=setInterval(tick,80);if(mode==='input')$('typed').focus()}
function tick(){if(!active)return;const left=Math.max(0,deadline-Date.now());$('time').textContent=`${Math.ceil(left/1000)}초`;$('clock').style.width=(left/15000*100)+'%';if(left===0)finish(null)}
function finish(value){if(!active)return;if(Date.now()>=deadline)value=null;active=false;clearInterval(timer);const ok=value===answer;let earned=ok?(usedHint?7:10):0;score+=earned;if(ok)correct++;const row={...current,given:value,answer,front,usedHint,ok};history.push(row);if(!ok)wrong.push(row);$('points').textContent=`${score}점`;$('hint').disabled=true;$('typed').disabled=true;$('submit').disabled=true;[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===answer)b.classList.add('correct');else if(b.textContent===value)b.classList.add('wrong')});$('feedback').replaceChildren();let status=document.createElement('strong');status.textContent=ok?`정답! +${earned}점`:value===null?'시간이 다 되었어요.':`아쉬워요. 선택한 답: ${value}`;let a=document.createElement('div');a.className='answer';a.textContent=`${current.word} · ${current.hanja}`;let p=document.createElement('p');p.textContent=current.meaning;$('feedback').append(status,a,p);$('feedback').classList.remove('hidden');$('next').textContent=index===deck.length-1?'결과 보기 →':'다음 문제 →';$('next').classList.remove('hidden');$('next').focus()}
function results(aborted=false){active=false;clearInterval(timer);screen('result');if(!practice&&!aborted&&score>best){best=score;try{localStorage.setItem('idiomDetective.best.v1',String(best))}catch(e){storageOK=false}}showBest();$('resultTag').textContent=practice?'틀린 문제 재도전 결과':aborted?'이번 판을 종료했어요':'오늘의 탐정 기록';$('score').textContent=`${score}점`;$('summary').textContent=`${history.length}문제 풀이 · 정답 ${correct}개 · 오답 ${wrong.length}개${aborted?' · 남은 문제 '+(deck.length-history.length)+'개':''}`;$('record').textContent=`${practice?'복습 점수는 최고 기록에 반영하지 않습니다.':'10문제 완주 기록만 최고 점수에 반영합니다.'} 최고 ${best}점${storageOK?'':' · 현재 최고 점수 저장 불가'}`;$('reviews').replaceChildren();if(!wrong.length)$('reviews').textContent=history.length?'틀린 문제가 없어요!':'아직 푼 문제가 없어요.';wrong.forEach(r=>{let box=document.createElement('div');box.className='review';let title=document.createElement('strong');title.textContent=`${r.word} (${r.hanja})`;let p=document.createElement('p');p.textContent=r.meaning;let m=document.createElement('small');m.textContent=`문제: ${r.front?r.word.slice(0,2)+'□□':'□□'+r.word.slice(2)} · 내 답: ${r.given===null?'시간 초과':r.given} · 정답: ${r.answer}`;box.append(title,p,m);$('reviews').append(box)});$('reviewStart').disabled=!wrong.length}
$('start').onclick=()=>start();$('again').onclick=()=>start();$('reviewStart').onclick=()=>start(wrong.map(({word,hanja,meaning})=>({word,hanja,meaning})));$('back').onclick=()=>screen('home');$('next').onclick=()=>{index++;if(index>=deck.length)results();else question()};$('hint').onclick=()=>{if(!active)return;if(Date.now()>=deadline){finish(null);return}usedHint=true;$('hintText').textContent=current.meaning;$('hintText').classList.remove('hidden');$('hint').disabled=true};$('form').onsubmit=e=>{e.preventDefault();if(e.isComposing)return;let v=$('typed').value.normalize('NFC').replace(/\s/g,'');if([...v].length!==2){$('typed').setCustomValidity('한글 두 글자를 입력해 주세요.');$('typed').reportValidity();return}finish(v)};$('typed').oninput=()=>$('typed').setCustomValidity('');$('quit').onclick=()=>{if(confirm('이번 판을 종료하고 지금까지의 결과를 볼까요?'))results(true)};document.addEventListener('visibilitychange',()=>{if(!document.hidden&&active)tick()});
